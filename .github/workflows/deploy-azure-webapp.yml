# CI/CD: compila o Gateway + BFF e publica no Azure Web App (Java SE 21).
# Configuração no GitHub (Settings -> Secrets and variables -> Actions):
#   Secrets   -> AZUREAPPSERVICE_PUBLISHPROFILE: conteúdo do .PublishSettings do Web App
#   Variables -> AZURE_WEBAPP_GATEWAY: nome do Web App do gateway no Azure
name: Deploy FitForge Gateway & BFF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build + testes (Maven)
        run: mvn -B clean package

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar o JAR
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_GATEWAY }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: '*.jar'
